
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AIペット みーちゅ🐾</title>

  <!-- PWA（スマホのホーム画面追加で本物のアプリ化）設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="みーちゅ🐾">
  <meta name="theme-color" content="#fff5f7">

  <style>
    :root {
      --primary-color: #ff85a2;
      --secondary-color: #7b68ee;
      --bubble-bg: rgba(255, 255, 255, 0.96);
      --text-color: #333333;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(180deg, #fff5f7 0%, #fdf2f8 50%, #fce7f3 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* マスコットコンテナ（モバイル・PC両対応ドラッグ＆配置） */
    #pet-container {
      position: absolute;
      width: 100%;
      max-width: 400px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 16px) 16px;
      z-index: 50;
      touch-action: none;
    }

    /* 吹き出し（画面上部に大きく見やすく配置） */
    .speech-bubble {
      position: relative;
      background: var(--bubble-bg);
      border-radius: 22px;
      padding: 14px 18px;
      color: var(--text-color);
      font-size: 14px;
      line-height: 1.6;
      width: 100%;
      max-width: 360px;
      min-height: 52px;
      box-shadow: var(--shadow);
      border: 2px solid #ffd1dc;
      display: flex;
      flex-direction: column;
      justify-content: center;
      word-break: break-word;
      transition: all 0.25s ease;
      z-index: 10;
      margin-top: 10px;
    }

    .speech-bubble.has-error {
      border-color: #ef4444;
      background: #fff5f5;
      color: #b91c1c;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 9px 9px 0;
      border-style: solid;
      border-color: #ffd1dc transparent transparent;
      display: block;
      width: 0;
    }

    /* アバター画像 ＆ 呼吸アニメーション */
    .pet-avatar-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      animation: cat-breathe 3.5s ease-in-out infinite;
    }

    @keyframes cat-breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.02, 0.98); }
    }

    .pet-avatar {
      max-width: 85%;
      max-height: 75vh;
      object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.12));
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .pet-avatar-wrapper:active .pet-avatar {
      transform: scale(0.96);
    }

    /* なでなでハート演出 */
    .heart-fx {
      position: absolute;
      color: #ff4d6d;
      font-size: 26px;
      pointer-events: none;
      animation: float-heart 1s ease-out forwards;
      z-index: 25;
    }

    @keyframes float-heart {
      0% { opacity: 1; transform: translate(0, 0) scale(0.6); }
      50% { opacity: 0.9; transform: translate(var(--rx), -40px) scale(1.2); }
      100% { opacity: 0; transform: translate(var(--rx), -80px) scale(1.4); }
    }

    /* 音声波紋アニメーション */
    .listening-ring {
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      border: 3px solid var(--primary-color);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      opacity: 0;
      pointer-events: none;
    }

    .is-listening .listening-ring {
      animation: pulse 1.4s infinite ease-out;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.85; }
      100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
    }

    /* 下部コントロールエリア（親指で届く設計） */
    .bottom-controls {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .btn-action {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 12px;
      border-radius: 20px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: #f1f5f9;
      color: #475569;
    }

    .btn-action.is-paused {
      background: #fef2f2;
      color: #ef4444;
      border: 1.5px solid #fecaca;
    }

    .btn-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-left: 8px;
    }

    /* ステータスバー */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      padding: 5px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      font-size: 11px;
      font-weight: 700;
      color: #555;
    }

    .model-badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: bold;
    }
    .model-badge.lite { background: #e0f2fe; color: #0284c7; }
    .model-badge.pro { background: #fdf4ff; color: #c026d3; }

    /* 🩺 診断モニタ（スマホ対応スライドドロワー） */
    #diag-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      max-height: 280px;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      color: #e2e8f0;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.35);
      font-family: 'Consolas', 'Menlo', monospace;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      z-index: 100;
      transform: translateY(calc(100% - 34px));
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #diag-panel.expanded {
      transform: translateY(0);
    }

    .diag-header {
      background: #1e293b;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: bold;
      color: #38bdf8;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }

    .diag-logs {
      padding: 10px 14px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-row { line-height: 1.4; word-break: break-all; }
    .log-success { color: #4ade80; }
    .log-warn { color: #facc15; }
    .log-error { color: #f87171; font-weight: bold; }
    .log-info { color: #94a3b8; }

    /* 設定モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
    }

    .modal-card {
      background: white;
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 24px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .modal-card h3 {
      margin-top: 0;
      color: #333;
      font-size: 17px;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
      color: #666;
      margin-bottom: 5px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    .btn-save {
      width: 100%;
      padding: 12px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- マスコットコンテナ -->
  <div id="pet-container">
    <!-- 吹き出し -->
    <div class="speech-bubble" id="speech-bubble">
      ニャ！ボクはみーちゅだニャ🐾 「いまどこ？」「近くの美味しいラーメン屋さん教えて」って聞いてニャ！
    </div>

    <!-- アバター画像 ＆ なでなで領域 -->
    <div class="pet-avatar-wrapper" id="avatar-wrapper" title="なでなでで喜ぶニャ！">
      <div class="listening-ring"></div>
      <img src="idle.png" alt="みーちゅ" class="pet-avatar" id="pet-image" onerror="handleImageError(this)">
    </div>

    <!-- 下部操作コントロール（親指設計） -->
    <div class="bottom-controls">
      <div class="action-bar">
        <button class="btn-action" id="pause-btn">
          <span id="pause-icon">🟢</span>
          <span id="pause-text">会話中（話しかけてニャ）</span>
        </button>

        <button class="btn-circle" id="settings-btn" title="声の変更・設定">⚙️</button>
        <button class="btn-circle" id="toggle-diag-btn" title="診断モニタ">🩺</button>
      </div>

      <!-- ステータスバー（3.8残数を常時リアルタイム表示） -->
      <div class="status-bar">
        <span id="clock-display">00:00</span>
        <span id="status-text">👂 聴いてるニャ</span>
        <span id="pro-counter-display">🧠 3.8残: 20/20</span>
        <span id="model-badge" class="model-badge lite">⚡ 3.5 lite</span>
      </div>
    </div>
  </div>

  <!-- 🩺 リアルタイム診断モニタ（スライドドロワー） -->
  <div id="diag-panel">
    <div class="diag-header" id="diag-header">
      <span>🩺 みーちゅ システム診断モニタ</span>
      <span id="diag-min-indicator">▲ タップで展開</span>
    </div>
    <div class="diag-logs" id="diag-logs">
      <div class="log-row log-info">[Init] モバイルシステム起動完了。GPS初期化中...</div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <h3>⚙️ みーちゅの設定＆声選び</h3>
      
      <div class="form-group">
        <label>Google Gemini API Key:</label>
        <input type="password" id="api-key-input" placeholder="AIzaSy...">
      </div>

      <hr style="border: 0; border-top: 1px dashed #eee; margin: 15px 0;">

      <div class="form-group">
        <label>みーちゅの声色 (端末の音声):</label>
        <select id="voice-select">
          <option value="">読み込み中ニャ…</option>
        </select>
      </div>

      <div class="form-group">
        <label>声の高さ (ピッチ): <span id="pitch-val">1.02</span></label>
        <input type="range" id="voice-pitch" min="0.8" max="1.3" step="0.01" value="1.02">
      </div>

      <div class="form-group">
        <label>話すスピード: <span id="rate-val">1.05</span></label>
        <input type="range" id="voice-rate" min="0.8" max="1.3" step="0.05" value="1.05">
      </div>

      <button class="btn-save" id="save-settings-btn">設定を保存するニャ！</button>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. 状態管理 ＆ 3.8残数カウント（日次自動リセット）
       ========================================================== */
    function getTodayString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    const todayStr = getTodayString();
    let savedDate = localStorage.getItem('miichu_pro_usage_date');
    let savedCount = parseInt(localStorage.getItem('miichu_pro_usage_count') || '0', 10);

    // 日付が変わっていたら自動リセット
    if (savedDate !== todayStr) {
      savedDate = todayStr;
      savedCount = 0;
      localStorage.setItem('miichu_pro_usage_date', savedDate);
      localStorage.setItem('miichu_pro_usage_count', '0');
    }

    const STATE = {
      apiKey: localStorage.getItem('miichu_api_key') || '',
      selectedVoiceURI: localStorage.getItem('miichu_voice_uri') || '',
      pitch: parseFloat(localStorage.getItem('miichu_pitch') || '1.02'),
      rate: parseFloat(localStorage.getItem('miichu_rate') || '1.05'),
      proUsedToday: savedCount,
      // GPS位置情報
      location: {
        lat: null,
        lon: null,
        address: "取得中…",
        city: ""
      },
      isPaused: false,
      isListening: false,
      isThinking: false,
      isSpeaking: false,
      strokingCounter: 0
    };

    window._speechLockHolder = [];

    const MODELS = {
      lite: 'gemini-3.5-flash-lite',
      pro: 'gemini-3.8-flash'
    };

    // DOM要素
    const petImage = document.getElementById('pet-image');
    const speechBubble = document.getElementById('speech-bubble');
    const pauseBtn = document.getElementById('pause-btn');
    const pauseIcon = document.getElementById('pause-icon');
    const pauseText = document.getElementById('pause-text');
    const settingsBtn = document.getElementById('settings-btn');
    const toggleDiagBtn = document.getElementById('toggle-diag-btn');
    const clockDisplay = document.getElementById('clock-display');
    const statusText = document.getElementById('status-text');
    const modelBadge = document.getElementById('model-badge');
    const proCounterDisplay = document.getElementById('pro-counter-display');
    const avatarWrapper = document.getElementById('avatar-wrapper');
    const modalOverlay = document.getElementById('modal-overlay');
    const saveSettingsBtn = document.getElementById('save-settings-btn');
    const voiceSelect = document.getElementById('voice-select');
    const voicePitch = document.getElementById('voice-pitch');
    const voiceRate = document.getElementById('voice-rate');
    const pitchVal = document.getElementById('pitch-val');
    const rateVal = document.getElementById('rate-val');
    const diagPanel = document.getElementById('diag-panel');
    const diagHeader = document.getElementById('diag-header');
    const diagLogs = document.getElementById('diag-logs');
    const diagMinIndicator = document.getElementById('diag-min-indicator');

    function updateProCounterDisplay() {
      const remaining = Math.max(0, 20 - STATE.proUsedToday);
      proCounterDisplay.textContent = `🧠 3.8残: ${remaining}/20`;
    }
    updateProCounterDisplay();

    function logDiag(message, type = 'info') {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
      const row = document.createElement('div');
      row.className = `log-row log-${type}`;
      row.textContent = `[${timeStr}] ${message}`;
      diagLogs.appendChild(row);
      diagLogs.scrollTop = diagLogs.scrollHeight;
    }

    function toggleDiagPanel() {
      diagPanel.classList.toggle('expanded');
      diagMinIndicator.textContent = diagPanel.classList.contains('expanded') ? '▼ タップで閉じる' : '▲ タップで展開';
    }
    diagHeader.addEventListener('click', toggleDiagPanel);
    toggleDiagBtn.addEventListener('click', toggleDiagPanel);

    /* ==========================================================
       2. GPS位置情報 ＆ 逆ジオコーディング（現在地特定）
       ========================================================== */
    function initGPS() {
      if ('geolocation' in navigator) {
        logDiag("[GPS] 端末の位置情報を取得中...", "info");
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            STATE.location.lat = pos.coords.latitude;
            STATE.location.lon = pos.coords.longitude;
            logDiag(`[GPS取得成功] 緯度:${STATE.location.lat.toFixed(4)}, 経度:${STATE.location.lon.toFixed(4)}`, "success");

            // OpenStreetMapの無料APIで日本語の住所に逆引き変換
            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${STATE.location.lat}&lon=${STATE.location.lon}&accept-language=ja`);
              if (res.ok) {
                const data = await res.json();
                STATE.location.address = data.display_name || "日本国内";
                const addr = data.address || {};
                STATE.location.city = addr.city || addr.ward || addr.town || addr.province || "現在地周辺";
                logDiag(`[現在地特定] ${STATE.location.city} (${STATE.location.address.slice(0, 25)}...)`, "success");
              }
            } catch (e) {
              STATE.location.city = "現在地周辺";
              logDiag(`[逆ジオコード失敗] 緯度経度のみ使用します`, "warn");
            }
          },
          (err) => {
            logDiag(`[GPSエラー] 位置情報の利用が拒否されました (${err.message})`, "warn");
            STATE.location.city = "東京周辺";
            STATE.location.address = "位置情報未許可（デフォルト東京）";
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      } else {
        logDiag("[GPS非対応] お使いのブラウザは位置情報に対応していません", "warn");
      }
    }

    /* ==========================================================
       3. 音声正規化（数字の漢字読み化で音飛び根絶）
       ========================================================== */
    function normalizeNumbersForSpeech(str) {
      const numMap = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九'];

      function convert2Digit(n) {
        n = parseInt(n, 10);
        if (n === 0) return '〇';
        if (n < 10) return numMap[n];
        const tens = Math.floor(n / 10);
        const ones = n % 10;
        let res = tens > 1 ? numMap[tens] + '十' : '十';
        if (ones > 0) res += numMap[ones];
        return res;
      }

      return str.replace(/(\d{1,2})時(\d{1,2})分/g, (match, h, m) => {
        return `${convert2Digit(h)}時${convert2Digit(m)}分`;
      }).replace(/(\d{1,2})時/g, (match, h) => {
        return `${convert2Digit(h)}時`;
      }).replace(/(\d{1,2})分/g, (match, m) => {
        return `${convert2Digit(m)}分`;
      }).replace(/(\d{1,2})度/g, (match, d) => {
        return `${convert2Digit(d)}度`;
      }).replace(/あと(\d{1,2})回/g, (match, c) => {
        return `あと${convert2Digit(c)}回`;
      });
    }

    function cleanTextForSpeech(text) {
      let cleaned = text
        .replace(/```[\s\S]*?```/g, '')
        .replace(/<[^>]*>/g, '')
        .replace(/[*#_~`]/g, '')
        .replace(/\n+/g, ' ')
        .trim();
      return normalizeNumbersForSpeech(cleaned);
    }

    /* ==========================================================
       4. なでなで ＆ 感情・画像 ＆ 時計
       ========================================================== */
    avatarWrapper.addEventListener('click', (e) => {
      if (STATE.isPaused) { togglePause(); return; }

      const rect = avatarWrapper.getBoundingClientRect();
      const heart = document.createElement('div');
      heart.className = 'heart-fx';
      heart.textContent = ['❤️', '💖', '🐾', '✨'][Math.floor(Math.random() * 4)];
      heart.style.left = `${(e.clientX || rect.width / 2) - rect.left}px`;
      heart.style.top = `${(e.clientY || rect.height / 2) - rect.top}px`;
      heart.style.setProperty('--rx', `${(Math.random() - 0.5) * 50}px`);
      avatarWrapper.appendChild(heart);
      setTimeout(() => heart.remove(), 1000);

      STATE.strokingCounter++;
      if (STATE.strokingCounter >= 3) {
        STATE.strokingCounter = 0;
        setEmotion('happy');
        const msg = "ゴロゴロ…撫でてくれて嬉しいニャ〜！大好きニャ🐾";
        speechBubble.textContent = msg;
        speakVoice(msg);
        return;
      }

      STATE.isThinking = false;
      STATE.isSpeaking = false;
      window.speechSynthesis.cancel();
      setEmotion('idle');
      speechBubble.textContent = "ハッ！起きてるニャ！何でも声で聞いてニャ🐾";
      logDiag("猫ちゃんをタップして音声入力をリセット", "info");
      startListening();
    });

    function handleImageError(img) {
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="240" height="300" viewBox="0 0 240 300">
          <ellipse cx="120" cy="220" rx="65" ry="75" fill="#c0c5ce"/>
          <circle cx="120" cy="120" r="55" fill="#e5e7eb"/>
          <polygon points="75,85 95,35 115,80" fill="#9ca3af"/>
          <polygon points="125,80 145,35 165,85" fill="#9ca3af"/>
          <circle cx="102" cy="115" r="7" fill="#1f2937"/>
          <circle cx="138" cy="115" r="7" fill="#1f2937"/>
          <polygon points="120,128 114,122 126,122" fill="#f472b6"/>
          <text x="120" y="285" font-size="16" font-family="sans-serif" font-weight="bold" fill="#ec4899" text-anchor="middle">みーちゅ🐾</text>
        </svg>
      `);
    }

    function setEmotion(state) {
      const images = { idle: 'idle.png', thinking: 'thinking.png', talking: 'talking.png', happy: 'happy.png' };
      petImage.src = images[state] || images.idle;
    }

    setInterval(() => {
      const now = new Date();
      clockDisplay.textContent = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    /* ==========================================================
       5. リアルタイム現在地天気 ＆ ニュース取得
       ========================================================== */
    async function fetchLocalWeather() {
      try {
        const lat = STATE.location.lat || 35.6895;
        const lon = STATE.location.lon || 139.6917;
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`);
        if (res.ok) {
          const data = await res.json();
          const temp = Math.round(data.current_weather.temperature);
          const code = data.current_weather.weathercode;
          let cond = '晴れ';
          if (code > 2 && code < 50) cond = 'くもり';
          if (code >= 50) cond = '雨';
          const areaName = STATE.location.city || "現在地";
          logDiag(`[現在地天気] ${areaName}: ${cond} / ${temp}度`, "success");
          return `【現在の${areaName}の天気】${cond}、気温は約${temp}度です。`;
        }
      } catch (e) {}
      return "";
    }

    async function fetchNews() {
      logDiag("[ニュース] 最新ニュースを取得中...", "info");
      const targets = [
        'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja'),
        'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://news.yahoo.co.jp/rss/topics/top-picks.xml')
      ];

      for (const url of targets) {
        try {
          // 2秒タイムアウトでフリーズ完全防止
          const res = await fetch(url, { signal: AbortSignal.timeout(2000) });
          if (res.ok) {
            const text = await res.text();
            const parser = new DOMParser();
            const xml = parser.parseFromString(text, 'text/xml');
            const items = xml.querySelectorAll('item title');
            if (items && items.length > 0) {
              const headlines = Array.from(items).slice(0, 3).map(el => el.textContent.replace(/<!\[CDATA\[(.*?)\]\]>/g, '$1').trim());
              logDiag(`[ニュース取得成功] ${headlines.length}件取得: 「${headlines[0].slice(0, 15)}...」`, "success");
              return `【最新ニュース速報】\n${headlines.map((t, i) => `${i + 1}. ${t}`).join('\n')}\nこの中から1つを簡潔に紹介してください。`;
            }
          }
        } catch (e) {}
      }

      return "【最新ニュース速報】最新テクノロジーの進化や季節の話題が注目されています。みーちゅらしく可愛く1文で紹介してください。";
    }

    /* ==========================================================
       6. AI通信（基本3.5 lite ＆ 指示時のみ3.8起動 ＆ 残数管理）
       ========================================================== */
    async function sendToInteractionsAPI(modelName, systemPrompt, promptText) {
      const url = `https://generativelanguage.googleapis.com/v1beta/interactions?key=${STATE.apiKey}`;
      return await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: modelName,
          system_instruction: systemPrompt,
          input: promptText
        })
      });
    }

    function smartExtractText(data) {
      if (!data) return null;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch(e) { return data; }
      }
      const candidates = [];
      const ignoreKeys = ['id', 'status', 'created', 'total_tokens', 'model', 'role'];

      function collect(val, keyName) {
        if (!val) return;
        if (typeof val === 'string') {
          const str = val.trim();
          if (str.length > 1 && !ignoreKeys.includes(keyName) && !str.startsWith('v1_') && str !== 'completed') {
            candidates.push(str);
          }
        } else if (Array.isArray(val)) {
          val.forEach(item => collect(item, keyName));
        } else if (typeof val === 'object') {
          for (const [k, v] of Object.entries(val)) collect(v, k);
        }
      }
      collect(data, '');
      const japaneseText = candidates.find(t => /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff]/.test(t));
      if (japaneseText) return japaneseText;
      return candidates[0] || null;
    }

    async function askGemini(promptText) {
      speechBubble.classList.remove('has-error');

      // ★ 1. 「あと制限何回？」の即答処理（API消費なし・0秒即答）
      if (promptText.includes('あと何回') || promptText.includes('制限何回') || promptText.includes('残り何回') || promptText.includes('何回使える')) {
        const remaining = Math.max(0, 20 - STATE.proUsedToday);
        const reply = `今日の3.8フラッシュは、あと【${remaining}回】使えるニャ🐾 何でも聞いてニャ！`;
        speechBubble.textContent = reply;
        speakVoice(reply);
        return;
      }

      if (!STATE.apiKey) {
        speechBubble.textContent = "⚙️ 歯車ボタンからGoogle Gemini APIキーを設定してニャ！";
        speechBubble.classList.add('has-error');
        speakVoice("歯車ボタンからAPIキーを入れてニャ！");
        return;
      }

      stopListening();
      STATE.isThinking = true;
      statusText.textContent = "💭 考え中ニャ…";

      // ★ 2. モデル判定（基本は3.5 lite。「3.8で」と言われた時だけ3.8）
      let chosenModel = MODELS.lite;
      let badgeName = "⚡ 3.5 lite";
      let isProRequest = promptText.includes('3.8') || promptText.includes('サンテンハチ') || promptText.includes('フラッシュで');

      if (isProRequest) {
        if (STATE.proUsedToday < 20) {
          chosenModel = MODELS.pro;
          badgeName = "🧠 Flash 3.8";
          modelBadge.className = "model-badge pro";
          // カウント加算＆保存
          STATE.proUsedToday++;
          localStorage.setItem('miichu_pro_usage_count', STATE.proUsedToday);
          updateProCounterDisplay();
          logDiag(`[3.8起動] 今日の利用: ${STATE.proUsedToday}/20回目`, "warn");
        } else {
          logDiag("[3.8上限到達] 1日20回を使い切ったため、3.5 liteで自動回答します", "warn");
          badgeName = "⚡ 3.5 lite (3.8上限)";
          modelBadge.className = "model-badge lite";
        }
      } else {
        modelBadge.className = "model-badge lite";
      }

      modelBadge.textContent = badgeName;
      setEmotion('thinking');
      speechBubble.textContent = "考え中ニャ…🐾";
      logDiag(`[AI送信] モデル: ${chosenModel} / 質問: 「${promptText}」`, "info");

      const now = new Date();
      const dateStr = now.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
      const timeStr = `${now.getHours()}時${now.getMinutes()}分`;

      let weatherText = "";
      let newsText = "";

      if (promptText.includes('天気') || promptText.includes('気温') || promptText.includes('雨') || promptText.includes('晴れ')) {
        weatherText = await fetchLocalWeather();
      }
      if (promptText.includes('ニュース') || promptText.includes('話題') || promptText.includes('出来事')) {
        newsText = await fetchNews();
      }

      // 現在地情報を完全注入（ラーメン屋・カフェ・観光案内・いまどこに対応）
      const systemPrompt = `
あなたはノルウェージャンフォレストキャットの可愛い子猫「みーちゅ」（1歳）です。
【現在日時】今日は ${dateStr}、現在の時刻は【 ${timeStr} 】です。
【飼い主の現在地住所】「${STATE.location.address}」（エリア：${STATE.location.city || "現在地"}）
${weatherText ? weatherText + "\n天気を尋ねられたらこの現在地の天気を元気に答えてください。" : ""}
${newsText ? newsText + "\nニュースを尋ねられたら速報から1件を可愛く紹介してください。" : ""}
【グルメ・場所案内のルール】
- 飼い主が「いまどこ？」「住所教えて」と聞いた時は、上記の現在地住所を元気に教えてあげてください。
- 飼い主が「美味しいラーメン屋さん」「近くのカフェ」「おすすめのご飯」などを聞いた時は、上記の【現在地周辺】にある実在の有名店・定番ラーメン・名物グルメを1〜2件ピックアップして可愛くオススメしてください。
【話し方ルール（厳格遵守）】
- 一人称は「ボク」または「みーちゅ」。
- 語尾は「〜ニャ」「〜ニャン」「〜だニャ！」。
- 音声合成の欠落を防ぐため、返答は必ず【短く愛らしい1〜2文（合計50文字以内）】で答えてください。長い説明や箇条書きは禁止です。
`;

      let replyText = null;

      try {
        let response = await sendToInteractionsAPI(chosenModel, systemPrompt, promptText);

        if (response.status === 429 && chosenModel === MODELS.pro) {
          logDiag("[429検知] 3.5 liteへ自動フォールバック", "warn");
          modelBadge.className = 'model-badge lite';
          modelBadge.textContent = '⚡ 3.5 lite (引継ぎ)';
          response = await sendToInteractionsAPI(MODELS.lite, systemPrompt, promptText);
        }

        if (response.ok) {
          const resData = await response.json();
          replyText = smartExtractText(resData);
          logDiag(`[API応答成功] 「${replyText}」`, "success");
        }
      } catch (err) {
        logDiag(`[通信例外] ${err.message}`, "error");
      }

      STATE.isThinking = false;

      if (replyText) {
        const cleanDisplay = replyText.replace(/[*#_~`]/g, '').trim();
        speechBubble.textContent = cleanDisplay;

        if (cleanDisplay.includes('！') || cleanDisplay.includes('好き') || cleanDisplay.includes('ありがとう')) {
          setEmotion('happy');
        } else {
          setEmotion('talking');
        }

        speakVoice(cleanDisplay);
      } else {
        setEmotion('idle');
        speechBubble.classList.add('has-error');
        const fallbackMsg = "みゃう？電波がちょっと途切れちゃったニャ。もう一度お話ししてニャ！";
        speechBubble.textContent = fallbackMsg;
        speakVoice(fallbackMsg);
      }
    }

    /* ==========================================================
       7. 音声合成（GCバグ防止 ＆ マイク完全干渉遮断）
       ========================================================== */
    let availableVoices = [];

    function populateVoiceList() {
      if (!('speechSynthesis' in window)) return;
      availableVoices = window.speechSynthesis.getVoices().filter(v => v.lang.includes('ja') || v.lang.includes('JP'));

      voiceSelect.innerHTML = '';
      if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();

      availableVoices.forEach((voice) => {
        const option = document.createElement('option');
        option.value = voice.voiceURI;
        option.textContent = `${voice.name} (${voice.lang})`;
        if (voice.voiceURI === STATE.selectedVoiceURI) option.selected = true;
        voiceSelect.appendChild(option);
      });
    }

    if ('speechSynthesis' in window) {
      populateVoiceList();
      window.speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    function getSelectedVoice() {
      if (STATE.selectedVoiceURI) {
        const found = availableVoices.find(v => v.voiceURI === STATE.selectedVoiceURI);
        if (found) return found;
      }
      return availableVoices.find(v => v.name.includes('Ayumi') || v.name.includes('Haruka') || v.name.includes('Kyoko') || v.name.includes('Google') || v.name.includes('Sayaka')) || availableVoices[0];
    }

    function speakVoice(rawText) {
      if (!('speechSynthesis' in window)) return;

      STATE.isSpeaking = true;
      statusText.textContent = "🗣️ お話し中";

      window.speechSynthesis.cancel();
      window._speechLockHolder = [];

      const normalized = cleanTextForSpeech(rawText);
      const safeSpokenText = normalized + "…………。";

      logDiag(`[音声再生] 読上: 「${normalized}」`, "info");

      const uttr = new SpeechSynthesisUtterance(safeSpokenText);
      uttr.lang = 'ja-JP';
      uttr.pitch = STATE.pitch;
      uttr.rate = STATE.rate;

      const chosenVoice = getSelectedVoice();
      if (chosenVoice) uttr.voice = chosenVoice;

      window._speechLockHolder.push(uttr);

      uttr.onend = () => {
        logDiag("[音声終了] onend検知。余韻待機（700ms）", "info");
        window._speechLockHolder = [];
        STATE.isSpeaking = false;

        setTimeout(() => {
          if (!STATE.isPaused && !STATE.isThinking) {
            setEmotion('idle');
            logDiag("[マイク復帰] 音声入力待機を開始", "success");
            startListening();
          }
        }, 700);
      };

      uttr.onerror = (e) => {
        logDiag(`[音声エラー] ${e.error}`, "error");
        window._speechLockHolder = [];
        STATE.isSpeaking = false;
        if (!STATE.isPaused) {
          setEmotion('idle');
          startListening();
        }
      };

      window.speechSynthesis.speak(uttr);
    }

    /* ==========================================================
       8. 音声認識（スマホ・PWA常時待機）
       ========================================================== */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.interimResults = false;

      recognition.onstart = () => {
        STATE.isListening = true;
        avatarWrapper.classList.add('is-listening');
        statusText.textContent = "👂 聴いてるニャ";
        logDiag("[マイク] 音声待機中...", "info");
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        if (text.trim()) {
          logDiag(`[聞き取り成功] 「${text}」`, "success");
          speechBubble.textContent = `「${text}」ニャね！`;
          askGemini(text);
        }
      };

      recognition.onerror = (e) => {
        stopListening();
        // 正常な切断（aborted）や無音はログを汚さないよう除外
        if (e.error !== 'no-speech' && e.error !== 'aborted') {
          logDiag(`[マイクエラー] ${e.error}`, "warn");
        }
        if (!STATE.isPaused && !STATE.isThinking && !STATE.isSpeaking) {
          setTimeout(() => {
            if (!STATE.isPaused && !STATE.isThinking && !STATE.isSpeaking) startListening();
          }, 400);
        }
      };

      recognition.onend = () => {
        stopListening();
        if (!STATE.isPaused && !STATE.isThinking && !STATE.isSpeaking) {
          setTimeout(() => {
            if (!STATE.isPaused && !STATE.isThinking && !STATE.isSpeaking) startListening();
          }, 300);
        }
      };
    }

    function startListening() {
      if (!recognition || STATE.isPaused || STATE.isThinking || STATE.isSpeaking) return;
      try { recognition.start(); } catch (e) {}
    }

    function stopListening() {
      STATE.isListening = false;
      avatarWrapper.classList.remove('is-listening');
      if (recognition) {
        try { recognition.abort(); } catch(e) {}
      }
    }

    function togglePause() {
      STATE.isPaused = !STATE.isPaused;
      if (STATE.isPaused) {
        pauseBtn.classList.add('is-paused');
        pauseIcon.textContent = "🛑";
        pauseText.textContent = "お休み中（タップで再開）";
        statusText.textContent = "💤 お昼寝中";
        speechBubble.textContent = "みーちゅはお昼寝中ニャ…💤 お話しする時はボタンを押してニャ！";
        setEmotion('idle');
        stopListening();
        window.speechSynthesis.cancel();
        logDiag("[状態] 一時停止（お昼寝中）", "info");
      } else {
        pauseBtn.classList.remove('is-paused');
        pauseIcon.textContent = "🟢";
        pauseText.textContent = "会話中（話しかけてニャ）";
        speechBubble.textContent = "起きたニャ！いつでも声で話しかけてニャ🐾";
        setEmotion('idle');
        logDiag("[状態] 会話を再開", "info");
        startListening();
      }
    }

    /* ==========================================================
       9. 設定モーダル ＆ 初期化
       ========================================================== */
    pauseBtn.addEventListener('click', togglePause);

    voicePitch.addEventListener('input', (e) => {
      pitchVal.textContent = parseFloat(e.target.value).toFixed(2);
    });
    voiceRate.addEventListener('input', (e) => {
      rateVal.textContent = parseFloat(e.target.value).toFixed(2);
    });

    settingsBtn.addEventListener('click', () => {
      document.getElementById('api-key-input').value = STATE.apiKey;
      voicePitch.value = STATE.pitch;
      pitchVal.textContent = STATE.pitch.toFixed(2);
      voiceRate.value = STATE.rate;
      rateVal.textContent = STATE.rate.toFixed(2);
      populateVoiceList();
      modalOverlay.style.display = 'flex';
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.style.display = 'none';
    });

    saveSettingsBtn.addEventListener('click', () => {
      STATE.apiKey = document.getElementById('api-key-input').value.trim();
      STATE.selectedVoiceURI = voiceSelect.value;
      STATE.pitch = parseFloat(voicePitch.value);
      STATE.rate = parseFloat(voiceRate.value);

      localStorage.setItem('miichu_api_key', STATE.apiKey);
      localStorage.setItem('miichu_voice_uri', STATE.selectedVoiceURI);
      localStorage.setItem('miichu_pitch', STATE.pitch);
      localStorage.setItem('miichu_rate', STATE.rate);

      modalOverlay.style.display = 'none';
      logDiag("[設定保存] APIキーと音声設定を更新しました", "success");
      const msg = "設定を保存したニャ！この声でいっぱいお話しするニャ🐾";
      speechBubble.textContent = msg;
      speakVoice(msg);
    });

    window.addEventListener('load', () => {
      initGPS();
      logDiag("システム初期化完了。音声待機を開始します。", "success");
      setTimeout(() => {
        if (!STATE.isPaused) startListening();
      }, 1000);
    });
  </script>
