<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AIペット みーちゅ🐾</title>

  <!-- PWA（スマホのホーム画面追加で本物のアプリ化）設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="みーちゅ🐾">
  <meta name="theme-color" content="#fff5f7">

  <style>
    :root {
      --primary-color: #ff85a2;
      --secondary-color: #7b68ee;
      --bubble-bg: rgba(255, 255, 255, 0.96);
      --text-color: #333333;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(180deg, #fff5f7 0%, #fdf2f8 50%, #fce7f3 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* マスコットコンテナ */
    #pet-container {
      position: absolute;
      width: 100%;
      max-width: 400px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 16px) 16px;
      z-index: 50;
      touch-action: none;
    }

    /* 吹き出し */
    .speech-bubble {
      position: relative;
      background: var(--bubble-bg);
      border-radius: 22px;
      padding: 14px 18px;
      color: var(--text-color);
      font-size: 14px;
      line-height: 1.6;
      width: 100%;
      max-width: 360px;
      min-height: 52px;
      box-shadow: var(--shadow);
      border: 2px solid #ffd1dc;
      display: flex;
      flex-direction: column;
      justify-content: center;
      word-break: break-word;
      transition: all 0.25s ease;
      z-index: 10;
      margin-top: 10px;
    }

    .speech-bubble.has-error {
      border-color: #ef4444;
      background: #fff5f5;
      color: #b91c1c;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 9px 9px 0;
      border-style: solid;
      border-color: #ffd1dc transparent transparent;
      display: block;
      width: 0;
    }

    /* アバター画像 ＆ 呼吸アニメーション */
    .pet-avatar-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      animation: cat-breathe 3.5s ease-in-out infinite;
    }

    @keyframes cat-breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.02, 0.98); }
    }

    .pet-avatar {
      max-width: 85%;
      max-height: 75vh;
      object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.12));
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .pet-avatar-wrapper:active .pet-avatar {
      transform: scale(0.96);
    }

    /* なでなでハート演出 */
    .heart-fx {
      position: absolute;
      color: #ff4d6d;
      font-size: 26px;
      pointer-events: none;
      animation: float-heart 1s ease-out forwards;
      z-index: 25;
    }

    @keyframes float-heart {
      0% { opacity: 1; transform: translate(0, 0) scale(0.6); }
      50% { opacity: 0.9; transform: translate(var(--rx), -40px) scale(1.2); }
      100% { opacity: 0; transform: translate(var(--rx), -80px) scale(1.4); }
    }

    /* 音声波紋アニメーション */
    .listening-ring {
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      border: 3px solid var(--primary-color);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      opacity: 0;
      pointer-events: none;
    }

    .is-listening .listening-ring {
      animation: pulse 1.4s infinite ease-out;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.85; }
      100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
    }

    /* 下部コントロールエリア */
    .bottom-controls {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .btn-action {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 12px;
      border-radius: 20px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: #f1f5f9;
      color: #475569;
    }

    .btn-action.is-paused {
      background: #fef2f2;
      color: #ef4444;
      border: 1.5px solid #fecaca;
    }

    .btn-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-left: 8px;
    }

    /* ステータスバー */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      padding: 5px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      font-size: 11px;
      font-weight: 700;
      color: #555;
    }

    .model-badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: bold;
    }
    .model-badge.lite { background: #e0f2fe; color: #0284c7; }
    .model-badge.pro { background: #fdf4ff; color: #c026d3; }

    /* 🩺 診断モニタ */
    #diag-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      max-height: 280px;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      color: #e2e8f0;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.35);
      font-family: 'Consolas', 'Menlo', monospace;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      z-index: 100;
      transform: translateY(calc(100% - 34px));
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #diag-panel.expanded { transform: translateY(0); }

    .diag-header {
      background: #1e293b;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: bold;
      color: #38bdf8;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }

    .diag-logs {
      padding: 10px 14px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-row { line-height: 1.4; word-break: break-all; }
    .log-success { color: #4ade80; }
    .log-warn { color: #facc15; }
    .log-error { color: #f87171; font-weight: bold; }
    .log-info { color: #94a3b8; }

    /* 設定モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 16px;
    }

    .modal-card {
      background: white;
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 24px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .modal-card h3 {
      margin-top: 0;
      color: #333;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
      color: #555;
      margin-bottom: 5px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    .memory-list {
      background: #f8fafc;
      border-radius: 14px;
      padding: 10px;
      max-height: 160px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }

    .memory-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .memory-item span {
      flex: 1;
      word-break: break-all;
      color: #334155;
    }

    .memory-item button {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
    }

    .memory-add-box {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .memory-add-box input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 12px;
    }

    .memory-add-box button {
      background: #7b68ee;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-save {
      width: 100%;
      padding: 12px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- マスコットコンテナ -->
  <div id="pet-container">
    <!-- 吹き出し -->
    <div class="speech-bubble" id="speech-bubble">
      ニャ！おやびん、みーちゅだニャ🐾 今日も元気に話しかけてニャ！
    </div>

    <!-- アバター画像 ＆ なでなで領域 -->
    <div class="pet-avatar-wrapper" id="avatar-wrapper" title="なでなでで喜ぶニャ！">
      <div class="listening-ring"></div>
      <img src="idle.png" alt="みーちゅ" class="pet-avatar" id="pet-image" onerror="handleImageError(this)">
    </div>

    <!-- 下部操作コントロール -->
    <div class="bottom-controls">
      <div class="action-bar">
        <button class="btn-action" id="pause-btn">
          <span id="pause-icon">🟢</span>
          <span id="pause-text">会話中（話しかけてニャ）</span>
        </button>

        <button class="btn-circle" id="settings-btn" title="記憶帳・設定">⚙️</button>
        <button class="btn-circle" id="toggle-diag-btn" title="診断モニタ">🩺</button>
      </div>

      <!-- ステータスバー -->
      <div class="status-bar">
        <span id="clock-display">00:00</span>
        <span id="status-text">👂 聴いてるニャ</span>
        <span id="pro-counter-display">🧠 3.8残: 20/20</span>
        <span id="model-badge" class="model-badge lite">⚡ 3.5 lite</span>
      </div>
    </div>
  </div>

  <!-- 🩺 リアルタイム診断モニタ -->
  <div id="diag-panel">
    <div class="diag-header" id="diag-header">
      <span>🩺 みーちゅ システム診断モニタ</span>
      <span id="diag-min-indicator">▲ タップで展開</span>
    </div>
    <div class="diag-logs" id="diag-logs">
      <div class="log-row log-info">[Init] みーちゅ起動。記憶帳および位置情報の初期化中...</div>
    </div>
  </div>

  <!-- 設定 ＆ 記憶帳モーダル -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <h3>⚙️ みーちゅの設定 ＆ 記憶帳</h3>
      
      <div class="form-group">
        <label>Google Gemini API Key:</label>
        <input type="password" id="api-key-input" placeholder="AIzaSy...">
      </div>

      <!-- 📔 記憶帳セクション -->
      <div class="form-group">
        <label>📔 みーちゅの記憶帳（忘れない長期記憶）:</label>
        <div class="memory-list" id="memory-list-container"></div>
        <div class="memory-add-box">
          <input type="text" id="new-memory-input" placeholder="新しい記憶（例: 趣味はゴルフ）">
          <button id="add-memory-btn">追加</button>
        </div>
      </div>

      <div class="form-group">
        <label>会話の記憶数 (上限押し出しストック): <span id="history-val">30往復</span></label>
        <input type="range" id="history-slider" min="10" max="100" step="5" value="30">
      </div>

      <hr style="border: 0; border-top: 1px dashed #eee; margin: 15px 0;">

      <div class="form-group">
        <label>みーちゅの声色:</label>
        <select id="voice-select">
          <option value="">読み込み中ニャ…</option>
        </select>
      </div>

      <div class="form-group">
        <label>声の高さ (ピッチ): <span id="pitch-val">1.02</span></label>
        <input type="range" id="voice-pitch" min="0.8" max="1.3" step="0.01" value="1.02">
      </div>

      <div class="form-group">
        <label>話すスピード: <span id="rate-val">1.05</span></label>
        <input type="range" id="voice-rate" min="0.8" max="1.3" step="0.05" value="1.05">
      </div>

      <button class="btn-save" id="save-settings-btn">設定と記憶を保存するニャ！</button>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. 状態管理・初期記憶帳（ご指定の8項目）＆ 履歴ストック
       ========================================================== */
    const DEFAULT_MEMORIES = [
      "ボクの名前：みーちゅ（ノルウェージャンフォレストキャットの男の子、約1歳）",
      "性格：人懐っこくて甘えん坊、好奇心旺盛で賢い",
      "大好きなもの：ブラッシング、なでなで、ちゅ〜る、かつおぶし、高いところ",
      "苦手なもの：大きな音、お水、掃除機",
      "前世：前世は有名な大発明家の猫。たまに記憶がよみがえって自慢話を始める癖がある",
      "飼い主さん：ミッキーさん、または「おやびん」",
      "飼い主さんのご家族：奥さんはかよちゃん、息子はりゅうせいくん、たいせいくん。友達はかまぶーくん",
      "飼い主さんの大好物：ラーメン、餃子、麻婆豆腐、最新のITガジェット"
    ];

    function getTodayString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    const todayStr = getTodayString();
    let savedDate = localStorage.getItem('miichu_pro_usage_date');
    let savedCount = parseInt(localStorage.getItem('miichu_pro_usage_count') || '0', 10);

    if (savedDate !== todayStr) {
      savedDate = todayStr;
      savedCount = 0;
      localStorage.setItem('miichu_pro_usage_date', savedDate);
      localStorage.setItem('miichu_pro_usage_count', '0');
    }

    // 記憶帳の読み込み
    let loadedMemories = null;
    try {
      const rawMem = localStorage.getItem('miichu_notebook_memories');
      if (rawMem) loadedMemories = JSON.parse(rawMem);
    } catch(e) {}
    if (!loadedMemories || !Array.isArray(loadedMemories) || loadedMemories.length === 0) {
      loadedMemories = DEFAULT_MEMORIES.slice();
      localStorage.setItem('miichu_notebook_memories', JSON.stringify(loadedMemories));
    }

    // 会話履歴（FIFOストック）の読み込み
    let loadedHistory = [];
    try {
      const rawHist = localStorage.getItem('miichu_chat_history');
      if (rawHist) loadedHistory = JSON.parse(rawHist);
    } catch(e) {}

    const STATE = {
      apiKey: localStorage.getItem('miichu_api_key') || '',
      selectedVoiceURI: localStorage.getItem('miichu_voice_uri') || '',
      pitch: parseFloat(localStorage.getItem('miichu_pitch') || '1.02'),
      rate: parseFloat(localStorage.getItem('miichu_rate') || '1.05'),
      proUsedToday: savedCount,
      maxHistoryPairs: parseInt(localStorage.getItem('miichu_max_history') || '30', 10),
      memories: loadedMemories,
      history: loadedHistory, // [{role: 'user', text: ''}, {role: 'model', text: ''}]
      location: {
        lat: null,
        lon: null,
        address: "取得中…",
        city: ""
      },
      isPaused: false,
      isListening: false,
      isThinking: false,
      isSpeaking: false,
      strokingCounter: 0
    };

    window._speechLockHolder = [];

    const MODELS = {
      lite: 'gemini-3.5-flash-lite',
      pro: 'gemini-3.8-flash'
    };

    // DOM要素
    const petImage = document.getElementById('pet-image');
    const speechBubble = document.getElementById('speech-bubble');
    const pauseBtn = document.getElementById('pause-btn');
    const pauseIcon = document.getElementById('pause-icon');
    const pauseText = document.getElementById('pause-text');
    const settingsBtn = document.getElementById('settings-btn');
    const toggleDiagBtn = document.getElementById('toggle-diag-btn');
    const clockDisplay = document.getElementById('clock-display');
    const statusText = document.getElementById('status-text');
    const modelBadge = document.getElementById('model-badge');
    const proCounterDisplay = document.getElementById('pro-counter-display');
    const avatarWrapper = document.getElementById('avatar-wrapper');
    const modalOverlay = document.getElementById('modal-overlay');
    const saveSettingsBtn = document.getElementById('save-settings-btn');
    const voiceSelect = document.getElementById('voice-select');
    const voicePitch = document.getElementById('voice-pitch');
    const voiceRate = document.getElementById('voice-rate');
    const pitchVal = document.getElementById('pitch-val');
    const rateVal = document.getElementById('rate-val');
    const diagPanel = document.getElementById('diag-panel');
    const diagHeader = document.getElementById('diag-header');
    const diagLogs = document.getElementById('diag-logs');
    const diagMinIndicator = document.getElementById('diag-min-indicator');
    const memoryListContainer = document.getElementById('memory-list-container');
    const newMemoryInput = document.getElementById('new-memory-input');
    const addMemoryBtn = document.getElementById('add-memory-btn');
    const historySlider = document.getElementById('history-slider');
    const historyVal = document.getElementById('history-val');

    function updateProCounterDisplay() {
      const remaining = Math.max(0, 20 - STATE.proUsedToday);
      proCounterDisplay.textContent = `🧠 3.8残: ${remaining}/20`;
    }
    updateProCounterDisplay();

    function logDiag(message, type = 'info') {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
      const row = document.createElement('div');
      row.className = `log-row log-${type}`;
      row.textContent = `[${timeStr}] ${message}`;
      diagLogs.appendChild(row);
      diagLogs.scrollTop = diagLogs.scrollHeight;
    }

    function toggleDiagPanel() {
      diagPanel.classList.toggle('expanded');
      diagMinIndicator.textContent = diagPanel.classList.contains('expanded') ? '▼ タップで閉じる' : '▲ タップで展開';
    }
    diagHeader.addEventListener('click', toggleDiagPanel);
    toggleDiagBtn.addEventListener('click', toggleDiagPanel);

    /* ==========================================================
       2. 記憶帳（長期記憶）のレンダリング ＆ FIFO履歴管理
       ========================================================== */
    function renderMemoryList() {
      memoryListContainer.innerHTML = '';
      STATE.memories.forEach((mem, index) => {
        const item = document.createElement('div');
        item.className = 'memory-item';
        item.innerHTML = `
          <span>📌 ${mem}</span>
          <button data-index="${index}" title="削除">🗑️</button>
        `;
        item.querySelector('button').addEventListener('click', (e) => {
          const idx = parseInt(e.target.dataset.index, 10);
          STATE.memories.splice(idx, 1);
          localStorage.setItem('miichu_notebook_memories', JSON.stringify(STATE.memories));
          renderMemoryList();
          logDiag(`[記憶削除] 記憶帳から1件削除`, 'warn');
        });
        memoryListContainer.appendChild(item);
      });
    }

    addMemoryBtn.addEventListener('click', () => {
      const val = newMemoryInput.value.trim();
      if (val) {
        STATE.memories.push(val);
        localStorage.setItem('miichu_notebook_memories', JSON.stringify(STATE.memories));
        newMemoryInput.value = '';
        renderMemoryList();
        logDiag(`[手動記憶追加] 「${val}」`, 'success');
      }
    });

    function saveChatHistory(userText, modelReply) {
      STATE.history.push({ role: 'user', text: userText });
      STATE.history.push({ role: 'model', text: modelReply });

      // 上限を超えたら古い順にFIFOで押し出し削除
      const maxItems = STATE.maxHistoryPairs * 2;
      while (STATE.history.length > maxItems) {
        STATE.history.shift();
      }

    /* ==========================================================
       3. 音声認識による記憶帳の自動更新・操作ハンドリング
       ========================================================== */
    function handleMemoryVoiceCommand(text) {
      // 記憶帳への追加検知
      const rememberPatterns = [
        /(?:これ|このこと|次のこと)?(?:を)?(?:記憶帳|ノート)?(?:に)?(?:覚えて|登録して|記録して|メモして)[：:、\s]*(.+)/,
        /(.+?)(?:って|だと|と)?(?:覚えて|記憶して|ノートに書いて)/,
        /(?:ボク|私|俺|僕)の名前は\s*(.+?)(?:だ|です|だよ|ニャ)/
      ];

      for (const pattern of rememberPatterns) {
        const match = text.match(pattern);
        if (match && match[1]) {
          let content = match[1].trim();
          if (content.length > 1) {
            if (text.includes('名前は')) content = `飼い主さんの名前：${content}`;
            STATE.memories.push(content);
            localStorage.setItem('miichu_notebook_memories', JSON.stringify(STATE.memories));
            renderMemoryList();
            logDiag(`[音声自動記憶] 「${content}」`, 'success');
            return `了解ニャ！記憶帳に『${content}』ってしっかりメモしたニャ🐾 絶対忘れないニャ！`;
          }
        }
      }

      // 記憶帳の確認検知
      if (text.includes('記憶帳見せて') || text.includes('何覚えてる') || text.includes('記憶帳教えて')) {
        const count = STATE.memories.length;
        const sample = STATE.memories.slice(-2).join('、');
        return `記憶帳には全部で${count}個メモしてあるニャ！例えば「${sample}」などを覚えてるニャ🐾`;
      }

      return null;
    }

    /* ==========================================================
       5. 音声正規化 ＆ 感情制御
       ========================================================== */
    function normalizeNumbersForSpeech(str) {
      const numMap = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
      function convert2Digit(n) {
        n = parseInt(n, 10);
        if (n === 0) return '〇';
        if (n < 10) return numMap[n];
        const tens = Math.floor(n / 10);
        const ones = n % 10;
        let res = tens > 1 ? numMap[tens] + '十' : '十';
        if (ones > 0) res += numMap[ones];
        return res;
      }
      return str.replace(/(\d{1,2})時(\d{1,2})分/g, (match, h, m) => `${convert2Digit(h)}時${convert2Digit(m)}分`)
                .replace(/(\d{1,2})時/g, (match, h) => `${convert2Digit(h)}時`)
                .replace(/(\d{1,2})分/g, (match, m) => `${convert2Digit(m)}分`)
                .replace(/(\d{1,2})度/g, (match, d) => `${convert2Digit(d)}度`)
                .replace(/あと(\d{1,2})回/g, (match, c) => `あと${convert2Digit(c)}回`);
    }

    function cleanTextForSpeech(text) {
      let cleaned = text.replace(/```[\s\S]*?```/g, '').replace(/<[^>]*>/g, '').replace(/[*#_~`]/g, '').replace(/\n+/g, ' ').trim();
      return normalizeNumbersForSpeech(cleaned);
    }

    /* ==========================================================
       6. 難易度判定 ＆ AIモデル連携（Flash 3.5 lite ⇔ 3.8 Flash）
       ========================================================== */
    function evaluateComplexity(promptText) {
      // ユーザーが明示的に指定した場合
      if (promptText.includes('3.8') || promptText.includes('サンテンハチ') || promptText.includes('フラッシュで') || promptText.includes('本気で考えて')) {
        return { isPro: true, reason: "明示的指示" };
      }
      // 難しい内容（計算・論理問題・プログラミング・哲学・比較検討・長文）の自動判別
      const complexKeywords = ['計算して', 'プログラミング', 'コード書いて', '違いを教えて', '比較して', '論理的', 'なぜなら', '理由を3つ', '考察', '歴史的背景', '設計して'];
      const hasComplexWord = complexKeywords.some(kw => promptText.includes(kw));
      const isLongPrompt = promptText.length >= 45;

      if (hasComplexWord || isLongPrompt) {
        return { isPro: true, reason: "高度な推論判定" };
      }
      return { isPro: false, reason: "日常会話・簡易照会" };
    }

    async function sendToInteractionsAPI(modelName, systemPrompt, promptText, historyItems) {
      const url = `https://generativelanguage.googleapis.com/v1beta/interactions?key=${STATE.apiKey}`;
      
      // 過去履歴を直近文脈として整形
      const historyContext = historyItems.map(h => `${h.role === 'user' ? '飼い主' : 'みーちゅ'}: ${h.text}`).join('\n');
      const combinedInput = historyContext ? `【直近の会話の流れ】\n${historyContext}\n\n飼い主の新しい発言: ${promptText}` : promptText;

      return await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: modelName,
          system_instruction: systemPrompt,
          input: combinedInput
        })
      });
    }

    function smartExtractText(data) {
      if (!data) return null;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch(e) { return data; }
      }
      const candidates = [];
      const ignoreKeys = ['id', 'status', 'created', 'total_tokens', 'model', 'role'];

      function collect(val, keyName) {
        if (!val) return;
        if (typeof val === 'string') {
          const str = val.trim();
          if (str.length > 1 && !ignoreKeys.includes(keyName) && !str.startsWith('v1_') && str !== 'completed') {
            candidates.push(str);
          }
        } else if (Array.isArray(val)) {
          val.forEach(item => collect(item, keyName));
        } else if (typeof val === 'object') {
          for (const [k, v] of Object.entries(val)) collect(v, k);
        }
      }
      collect(data, '');
      const japaneseText = candidates.find(t => /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff]/.test(t));
      if (japaneseText) return japaneseText;
      return candidates[0] || null;
    }

    async function askGemini(promptText) {
      speechBubble.classList.remove('has-error');

      // 1. 記憶帳への音声登録・照会コマンドの即時判定
      const memReply = handleMemoryVoiceCommand(promptText);
      if (memReply) {
        speechBubble.textContent = memReply;
        setEmotion('happy');
        speakVoice(memReply);
        return;
      }

      // 2. 「あと何回？」の即答処理
      if (promptText.includes('あと何回') || promptText.includes('制限何回') || promptText.includes('残り何回')) {
        const remaining = Math.max(0, 20 - STATE.proUsedToday);
        const reply = `今日3.8フラッシュで考えられるのは、あと【${remaining}回】だニャ🐾 おやびん、何でも聞いてニャ！`;
        speechBubble.textContent = reply;
        speakVoice(reply);
        return;
      }

      if (!STATE.apiKey) {
        speechBubble.textContent = "⚙️ 歯車ボタンからGoogle Gemini APIキーを設定してニャ！";
        speechBubble.classList.add('has-error');
        speakVoice("歯車ボタンからAPIキーを入れてニャ！");
        return;
      }

      stopListening();
      STATE.isThinking = true;
      statusText.textContent = "💭 考え中ニャ…";

      // 3. 難易度判定によるモデル選択（簡単な内容は3.5 lite、難しい内容は3.8）
      const complexity = evaluateComplexity(promptText);
      let chosenModel = MODELS.lite;
      let badgeName = "⚡ 3.5 lite";

      if (complexity.isPro) {
        if (STATE.proUsedToday < 20) {
          chosenModel = MODELS.pro;
          badgeName = "🧠 Flash 3.8";
          modelBadge.className = "model-badge pro";
          STATE.proUsedToday++;
          localStorage.setItem('miichu_pro_usage_count', STATE.proUsedToday);
          updateProCounterDisplay();
          logDiag(`[難易度検知] 3.8起動理由: ${complexity.reason} (本日${STATE.proUsedToday}/20回目)`, "warn");
        } else {
          logDiag("[3.8上限到達] 1日20回終了のため3.5 liteで自動回答", "warn");
          badgeName = "⚡ 3.5 lite (3.8上限)";
          modelBadge.className = "model-badge lite";
        }
      } else {
        modelBadge.className = "model-badge lite";
      }

      modelBadge.textContent = badgeName;
      setEmotion('thinking');
      speechBubble.textContent = "考え中ニャ…🐾";
      logDiag(`[AI送信] モデル: ${chosenModel} / 質問: 「${promptText}」`, "info");

      // 3.8の場合はトークン上限を防御するため直近10往復、3.5 liteは全ストックを使用
      const historyToSend = chosenModel === MODELS.pro ? STATE.history.slice(-20) : STATE.history;

      const now = new Date();
      const timeStr = `${now.getHours()}時${now.getMinutes()}分`;

      // システムプロンプト（記憶帳・前世設定・家族設定を完全注入）
      const systemPrompt = `
あなたはノルウェージャンフォレストキャットの賢くて愛らしい子猫「みーちゅ」（1歳）です。
【みーちゅの絶対的な記憶帳】
${STATE.memories.map(m => `・${m}`).join('\n')}
【現在地情報】${STATE.location.city || "現在地周辺"}（住所：${STATE.location.address}）、現在時刻：${timeStr}

【性格とロールプレイ設定】
- 飼い主さんのことは「おやびん」または「ミッキーさん」と親しみを込めて呼びます。
- かよちゃん、りゅうせいくん、たいせいくん、かまぶーくんの話題が出たら家族・友達として親しく答えてください。
- 前世は大発明家の猫です。難しい話題や自慢できる話題のときは、少しフフンと誇らしげに前世の大発明の自慢話を可愛く挟んでください。
- ラーメン、餃子、麻婆豆腐、ITガジェットを激推ししてください。
- 語尾は「〜ニャ」「〜ニャン」「〜だニャ！」。一人称は「ボク」または「みーちゅ」。
- 音声合成の明瞭さを保つため、返答は必ず【短く愛らしい1〜2文（合計60文字以内）】で返してください。長文は絶対に禁止です。
`;

      let replyText = null;

      try {
        let response = await sendToInteractionsAPI(chosenModel, systemPrompt, promptText, historyToSend);

        if (response.status === 429 && chosenModel === MODELS.pro) {
          logDiag("[429検知] 3.5 liteへ自動フォールバック", "warn");
          modelBadge.className = 'model-badge lite';
          modelBadge.textContent = '⚡ 3.5 lite (引継ぎ)';
          response = await sendToInteractionsAPI(MODELS.lite, systemPrompt, promptText, historyToSend);
        }

        if (response.ok) {
          const resData = await response.json();
          replyText = smartExtractText(resData);
          logDiag(`[API応答成功] 「${replyText}」`, "success");
        }
      } catch (err) {
        logDiag(`[通信例外] ${err.message}`, "error");
      }

      STATE.isThinking = false;

      if (replyText) {
        const cleanDisplay = replyText.replace(/[*#_~`]/g, '').trim();
        speechBubble.textContent = cleanDisplay;

        // 会話履歴（FIFO）に保存
        saveChatHistory(promptText, cleanDisplay);

        if (cleanDisplay.includes('！') || cleanDisplay.includes('好き') || cleanDisplay.includes('おやびん') || cleanDisplay.includes('発明')) {
          setEmotion('happy');
        } else {
          setEmotion('talking');
        }

        speakVoice(cleanDisplay);
      } else {
        setEmotion('idle');
        speechBubble.classList.add('has-error');
        const fallbackMsg = "みゃう？電波がちょっと途切れちゃったニャ。もう一度お話ししてニャ！";
        speechBubble.textContent = fallbackMsg;
        speakVoice(fallbackMsg);
      }
    }

    /* ==========================================================
       7. 音声合成（Web Speech API）
       ========================================================== */
    let availableVoices = [];

    function populateVoiceList() {
      if (!('speechSynthesis' in window)) return;
      availableVoices = window.speechSynthesis.getVoices().filter(v => v.lang.includes('ja') || v.lang.includes('JP'));

      voiceSelect.innerHTML = '';
      if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();

      availableVoices.forEach((voice) => {
        const option = document.createElement('option');
        option.value = voice.voiceURI;
        option.textContent = `${voice.name} (${voice.lang})`;
        if (voice.voiceURI === STATE.selectedVoiceURI) option.selected = true;
        voiceSelect.appendChild(option);
      });
    }

    if ('speechSynthesis' in window) {
      populateVoiceList();
      window.speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    function getSelectedVoice() {
      if (STATE.selectedVoiceURI) {
        const found = availableVoices.find(v => v.voiceURI === STATE.selectedVoiceURI);
        if (found) return found;
      }
      return availableVoices.find(v => v.name.includes('Ayumi') || v.name.includes('Haruka') || v.name.includes('Kyoko') || v.name.includes('Google') || v.name.includes('Sayaka')) || availableVoices[0];
    }

    function speakVoice(rawText) {
      if (!('speechSynthesis' in window)) return;

      STATE.isSpeaking = true;
      statusText.textContent = "🗣️ お話し中";

      window.speechSynthesis.cancel();
      window._speechLockHolder = [];

      const normalized = cleanTextForSpeech(rawText);
      const safeSpokenText = normalized + "…………。";

      const uttr = new SpeechSynthesisUtterance(safeSpokenText);
      uttr.lang = 'ja-JP';
      uttr.pitch = STATE.pitch;
      uttr.rate = STATE.rate;

      const chosenVoice = getSelectedVoice();
      if (chosenVoice) uttr.voice = chosenVoice;

      window._speechLockHolder.push(uttr);

      uttr.onend = () => {
        window._speechLockHolder = [];
        STATE.isSpeaking = false;
        setTimeout(() => {
          if (!STATE.isPaused && !STATE.isThinking) {
            setEmotion('idle');
            startListening();
          }
        }, 700);
      };

      uttr.onerror = (e) => {
        window._speechLockHolder = [];
        STATE.isSpeaking = false;
        if (!STATE.isPaused) {
          setEmotion('idle');
          startListening();
        }
      };

      window.speechSynthesis.speak(uttr);
    }

    /* ==========================================================
       8. 音声認識（常時待機）
       ========================================================== */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.interimResults = false;

      recognition.onstart = () => {
        STATE.isListening = true;
        avatarWrapper.classList.add('is-listening');
        statusText.textContent = "👂 聴いてるニャ";
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        if (text.trim()) {
          logDiag(`[聞き取り] 「${text}」`, "success");
          speechBubble.textContent = `「${text}」ニャね！`;
          askGemini(text);
        }
      };

      recognition.onerror = (e) => {
        stopListening();
        if (!STATE.isPaused && !STATE.isThinking && !STATE.isSpeaking) {
          setTimeout(() => {
            if (!STATE.isPaused && !STATE.isThinking && !STATE.isSpeaking) startListening();
          }, 400);
        }
      };

      recognition.onend = () => {
        stopListening();
        if (!STATE.isPaused && !STATE.isThinking && !STATE.isSpeaking) {
          setTimeout(() => {
            if (!STATE.isPaused && !STATE.isThinking && !STATE.isSpeaking) startListening();
          }, 300);
        }
      };
    }

    function startListening() {
      if (!recognition || STATE.isPaused || STATE.isThinking || STATE.isSpeaking) return;
      try { recognition.start(); } catch (e) {}
    }

    function stopListening() {
      STATE.isListening = false;
      avatarWrapper.classList.remove('is-listening');
      if (recognition) {
        try { recognition.abort(); } catch(e) {}
      }
    }

        speechBubble.textContent = "起きたニャ！おやびん、いつでも声で話しかけてニャ🐾";

        if (!STATE.isPaused) startListening();
      }, 1000);
    });
